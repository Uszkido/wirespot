name: Deploy Web Dashboard to Firebase Hosting

on:
  push:
    branches: ["main"]
    paths:
      - "web_app/**"
      - "firebase.json"
      - ".firebaserc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project wirespot-app
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
