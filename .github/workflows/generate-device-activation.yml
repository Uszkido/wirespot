name: Generate mobile device activation

on:
  workflow_dispatch:
    inputs:
      device_id:
        description: Device ID shown in WireSpot Settings
        required: true
        type: string
      plan:
        description: Activation plan (monthly/yearly require server billing)
        required: true
        default: lifetime
        type: choice
        options:
          - lifetime
          - monthly
          - yearly

permissions:
  contents: read

jobs:
  generate:
    name: Generate activation code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Validate request
        shell: bash
        env:
          DEVICE_ID: ${{ inputs.device_id }}
        run: |
          set -euo pipefail
          normalized="$(printf '%s' "$DEVICE_ID" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          if [[ "${#normalized}" -lt 8 || ! "$normalized" =~ ^[A-Z0-9:_-]+$ ]]; then
            echo "Device ID must contain at least 8 letters, digits, ':', '_' or '-'." >&2
            exit 1
          fi
          echo "DEVICE_ID=$normalized" >> "$GITHUB_ENV"

      - name: Generate activation code
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          args=("$DEVICE_ID" --plan "$PLAN")
          if [[ "$PLAN" == "monthly" ]]; then
            args+=(--expires "$(date -u -d '+30 days' +%Y-%m-%d)")
          elif [[ "$PLAN" == "yearly" ]]; then
            args+=(--expires "$(date -u -d '+365 days' +%Y-%m-%d)")
          fi
          code="$(dart run tools/license_generator.dart "${args[@]}" | awk -F'=> ' '{print $2}')"
          if [[ -z "$code" ]]; then
            echo "The license generator did not return an activation code." >&2
            exit 1
          fi
          {
            echo "## WireSpot mobile activation"
            echo
            echo "- Device ID: `$DEVICE_ID`"
            echo "- Requested plan: `$PLAN`"
            echo "- Activation code: `$code`"
            echo
            echo "Enter this activation in WireSpot Settings > Premium license. Local timed licenses rely on the device clock and cannot be remotely revoked."
          } | tee activation-summary.md >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$code" > activation-code.txt

      - name: Upload activation record
        uses: actions/upload-artifact@v7
        with:
          name: wirespot-activation-${{ inputs.device_id }}
          path: |
            activation-code.txt
            activation-summary.md
          retention-days: 7
