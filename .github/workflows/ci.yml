name: WireSpot CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wirespot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, Test, and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Validate Web Dashboard static files
        run: test -f web_app/index.html && test -f web_app/styles.css && test -f web_app/app.js

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: WireSpot-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  backend:
    name: Analyze and test Cloud API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: wirespot_backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install backend dependencies
        run: dart pub get

      - name: Analyze backend
        run: dart analyze

      - name: Run backend tests
        run: dart test

      - name: Build Dart Frog route bundle
        run: |
          dart pub global activate dart_frog_cli 1.2.6
          dart_frog build

      - name: Smoke test production backend bundle
        run: |
          mkdir -p "$RUNNER_TEMP/wirespot"
          WIRESPOT_ENV=production \
          WIRESPOT_ENABLE_LOCAL_AUTH=true \
          WIRESPOT_STORE_PATH="$RUNNER_TEMP/wirespot/store.json" \
          PORT=8080 \
          nohup dart build/bin/server.dart > "$RUNNER_TEMP/wirespot/backend.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if response=$(curl --silent --show-error --fail http://127.0.0.1:8080/health); then
              echo "$response"
              echo "$response" | grep -q '"productionReady":true'
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/wirespot/backend.log"
          exit 1

  windows:
    name: Build Windows desktop app
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: WireSpot-windows-x64
          path: build/windows/x64/runner/Release
          if-no-files-found: error

  linux:
    name: Build Linux desktop app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build Linux release
        run: flutter build linux --release

      - name: Upload Linux desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: WireSpot-linux-x64
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  ios:
    name: Analyze and build iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable iOS
        run: flutter config --enable-ios

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app WireSpot-ios-unsigned.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: WireSpot-ios-unsigned
          path: WireSpot-ios-unsigned.zip
          if-no-files-found: error

  hosted-smoke:
    name: Verify hosted production sync
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run authenticated hosted smoke test
        run: node web_app/smoke-test.mjs
        env:
          WIRESPOT_REQUIRE_PRODUCTION: true
          WIRESPOT_SMOKE_EMAIL: ${{ secrets.WIRESPOT_SMOKE_EMAIL }}
          WIRESPOT_SMOKE_PASSWORD: ${{ secrets.WIRESPOT_SMOKE_PASSWORD }}
          WIRESPOT_SMOKE_ROUTER_JSON: ${{ secrets.WIRESPOT_SMOKE_ROUTER_JSON }}
          WIRESPOT_SMOKE_TELEMETRY_JSON: ${{ secrets.WIRESPOT_SMOKE_TELEMETRY_JSON }}
