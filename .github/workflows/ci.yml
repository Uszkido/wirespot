name: WireSpot CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wirespot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, Test, and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android debug APK
        run: |
          for attempt in 1 2 3; do
            flutter build apk --debug && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "APK build failed; retrying after a backoff to handle transient repository rate limits."
              sleep $((attempt * 45))
            fi
          done
          exit 1

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WireSpot-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
