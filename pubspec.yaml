name: wirespot
description: Secure MikroTik RouterOS hotspot management over WireGuard VPN.
publish_to: "none"
version: 1.0.0+32

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  get_it: ^9.3.0
  dio: ^5.11.1
  drift: ^2.31.0
  # sqlite3 3.x pulls hooks/record_use versions newer than Flutter's pinned
  # flutter_test meta package. Drift works with the 2.x API used by WireSpot.
  sqlite3: ^2.9.4
  # sqlite3 2.x needs the package that actually bundles libsqlite3.so.
  # 0.6.x is intentionally a no-op for sqlite3 3.x and causes Android
  # installs to fail at runtime when NativeDatabase is opened.
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  path_provider: ^2.1.0
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.1.2
  esc_pos_utils_plus: ^2.0.0
  intl: ^0.20.2
  crypto: ^3.0.0
  uuid: ^4.6.0
  pdf: ^3.12.0
  excel: ^4.0.6
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  csv: ^8.0.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: 2.31.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
